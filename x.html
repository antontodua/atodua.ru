<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark"><title>Private space · atodua.ru</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f5f3ef;background:#101211;font-synthesis:none;--key:clamp(34px,6.2vh,70px)}
*{box-sizing:border-box}
html,body{overflow-x:hidden}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 15% 0%,#25352c66,transparent 55%),radial-gradient(ellipse at 95% 90%,#35302044,transparent 45%),#101211}
header{position:absolute;top:clamp(20px,4vh,40px);left:clamp(20px,3vw,52px);right:clamp(20px,3vw,52px);display:flex;justify-content:space-between;align-items:center;color:#c9cec8}
.brand{font-size:clamp(20px,2vw,30px);font-weight:650;letter-spacing:-.04em}.brand span{color:#90ae86}
.pill{border:1px solid #ffffff20;border-radius:40px;padding:10px 18px;font-size:clamp(11px,1vw,15px);letter-spacing:.15em;color:#b3bcb0}
main{min-height:100vh;display:grid;place-items:center;padding:clamp(70px,12vh,130px) 20px clamp(12px,3vh,30px)}
.card{width:min(820px,100%);padding:clamp(18px,3vh,36px);border:1px solid #ffffff13;border-radius:28px;background:linear-gradient(145deg,#252b25cc,#191d19ee);box-shadow:0 25px 80px #0005}
.cardtop{display:flex;align-items:center;justify-content:space-between;margin-bottom:clamp(12px,2vh,22px)}
.cardtop span{font-size:clamp(15px,1.4vw,20px);color:#9ca896}
.lock{color:#bdd1af;width:26px;height:26px}
.entry{position:relative}
input{width:100%;height:calc(var(--key) * 1.15);background:#111710;border:1px solid #ffffff16;border-radius:14px;color:#e7f0e0;padding:0 64px 0 20px;font-size:clamp(22px,2.4vw,34px);letter-spacing:.14em;outline:none}
input:focus{border-color:#a8c493;box-shadow:0 0 0 3px #a8c4931c}
input::placeholder{font-size:clamp(16px,1.5vw,22px);letter-spacing:0;color:#65715f}
.eye{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:46px;height:46px;border:0;background:transparent;color:#a8b6a0;font-size:22px;cursor:pointer}
.status{min-height:1.4em;margin:0;padding:clamp(8px,1.4vh,14px) 2px;font-size:clamp(14px,1.3vw,19px);color:#9aa693;line-height:1.4}
.status.error{color:#f2ac9e}
.keys{display:grid;grid-template-columns:repeat(18,1fr);gap:clamp(5px,1vh,10px)}
.key{grid-column:span 2;height:var(--key);border-radius:12px;border:1px solid #ffffff0e;background:#ffffff04;color:#e5e9e1;font:inherit;font-size:clamp(18px,2.3vw,32px);cursor:pointer;transition:background .14s,transform .14s}
.key.wide{grid-column:span 9;font-size:clamp(14px,1.4vw,20px);color:#a1ac9b}
.key:hover{background:#ffffff0d}.key:active{transform:scale(.97)}
.key:focus-visible,button:focus-visible{outline:2px solid #c6e3b2;outline-offset:3px;background:#35482c}
.remember{display:flex;align-items:center;gap:12px;margin-top:clamp(12px,2vh,20px);font-size:clamp(14px,1.3vw,19px);color:#aab5a3;cursor:pointer}
.remember input{width:22px;height:22px;padding:0;accent-color:#c6ddb4;flex-shrink:0}
.remember span{margin-left:auto;font-size:clamp(12px,1.1vw,16px);color:#7e8b77}
.submit{width:100%;height:var(--key);background:#c6ddb4;color:#172010;border:0;border-radius:14px;margin-top:clamp(12px,2vh,20px);font-size:clamp(16px,1.5vw,22px);font-weight:650;cursor:pointer}
.submit:hover{background:#d6e8c9}.submit:disabled{opacity:.55;cursor:wait}
.card,.card button{text-transform:uppercase}
.cardtop span,.status,.remember,.key.wide,.submit{letter-spacing:.12em}
input::placeholder{text-transform:uppercase;letter-spacing:.12em}
.hidden{display:none!important}
/* Saved key present: show only the background until it is checked */
.checking header,.checking main{visibility:hidden}
.checking,.checking body,.framed,.framed body{background:#000}
.view{position:fixed;top:0;left:0;width:100%;height:100%;border:0;background:#000}
.remember span{white-space:nowrap}
@media(max-width:600px){.keys{gap:5px}.key{border-radius:9px}.card{border-radius:22px}.cardtop span,.status,.remember,.key.wide,.submit,input::placeholder{letter-spacing:.06em}.status,.remember{font-size:13px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<script>if(document.cookie.indexOf('atodua_x_key_v1=')>-1&&!/[?&]forget(&|=|$)/.test(location.search))document.documentElement.className='checking';</script>
</head>
<body>
<header><div class="brand">atodua<span>.ru</span></div><div class="pill">PRIVATE SPACE</div></header>
<main>
<form class="card" id="gate"><div class="cardtop"><span>Access code</span><svg class="lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V7a4 4 0 018 0v3M12 14v3"/></svg></div>
<div class="entry"><input id="code" type="password" autocapitalize="characters" spellcheck="false" autocomplete="off" maxlength="64" placeholder="Enter code" aria-label="Access code" aria-describedby="status"><button type="button" class="eye" id="eye" aria-label="Show code" aria-pressed="false">◉</button></div>
<p id="status" class="status" role="status" aria-live="polite"></p>
<div class="keys" id="keys" role="group" aria-label="Alphanumeric keyboard"></div>
<label class="remember"><input type="checkbox" id="remember">Remember on this device <span>365 days</span></label>
<button class="submit" type="submit" id="unlock">Open space &nbsp; ↗</button></form>
</main>
<script>
'use strict';
const payload={"salt":"ojZzOqqTHIvypLxkCVntOw==","iv":"7L5jbL9zypTfspcX","data":"G37lqE/f5u4IVPu+pPfYuPZtM8gAOCD4soysuJwlUljk/7COda0VV1FaZhkhtUjUNmxiJCSfbg/O7HhX6Y1iOdSdxNU=","iterations":600000};
const $=id=>document.getElementById(id),input=$('code'),status=$('status');let busy=false;
const cookieName='atodua_x_key_v1',hint='Use the keys below or your keyboard',COLS=9;
const decode=s=>Uint8Array.from(atob(s),x=>x.charCodeAt(0));
const encode=b=>btoa(String.fromCharCode(...new Uint8Array(b)));
function cookieSuffix(){return '; Path=/; SameSite=Strict'+(location.protocol==='https:'?'; Secure':'');}
function forget(){document.cookie=cookieName+'=; Max-Age=0'+cookieSuffix();}
function readKey(){const pair=document.cookie.split('; ').find(x=>x.startsWith(cookieName+'='));return pair?decodeURIComponent(pair.slice(cookieName.length+1)):null;}
function saveKey(raw){document.cookie=cookieName+'='+encodeURIComponent(encode(raw))+'; Max-Age=31536000'+cookieSuffix();return readKey()===encode(raw);}
function setBusy(on){busy=on;if(!$('gate'))return;$('unlock').disabled=on;input.disabled=on;$('remember').disabled=on;document.querySelectorAll('.key').forEach(x=>x.disabled=on);}
function setStatus(text,error=false){status.textContent=text;status.className='status'+(error?' error':'');}
function showFrame(content){const src=String(content&&content.src||'');if(!/^https:\/\//.test(src))throw new Error('Unexpected payload');const frame=document.createElement('iframe');frame.className='view';frame.setAttribute('allowfullscreen','');frame.setAttribute('referrerpolicy','no-referrer');frame.setAttribute('allow','autoplay; fullscreen; encrypted-media; picture-in-picture');frame.src=src;document.body.innerHTML='';document.body.appendChild(frame);document.documentElement.className='framed';frame.focus();}
async function decrypt(raw){const key=await crypto.subtle.importKey('raw',raw,{name:'AES-GCM'},false,['decrypt']);const data=await crypto.subtle.decrypt({name:'AES-GCM',iv:decode(payload.iv)},key,decode(payload.data));return JSON.parse(new TextDecoder().decode(data));}

// 9 × 4 grid: 1–9, 0, A–Z, then a row with Clear and Delete
const labels={CLEAR:['Clear','Clear code'],BACK:['⌫ Delete','Delete last character']};
for(const value of [...'1234567890ABCDEFGHIJKLMNOPQRSTUVWXYZ','CLEAR','BACK']){const btn=document.createElement('button');btn.type='button';const action=labels[value];btn.className='key'+(action?' wide':'');btn.textContent=action?action[0]:value;btn.setAttribute('aria-label',action?action[1]:value);btn.addEventListener('click',()=>{if(busy)return;input.value=value==='CLEAR'?'':value==='BACK'?input.value.slice(0,-1):(input.value+value).slice(0,64);setStatus(hint);});$('keys').append(btn);}
setStatus(hint);

$('eye').onclick=()=>{const show=input.type==='password';input.type=show?'text':'password';$('eye').setAttribute('aria-label',show?'Hide code':'Show code');$('eye').setAttribute('aria-pressed',String(show));};
input.addEventListener('input',()=>{input.value=input.value.toUpperCase().replace(/[^A-Z0-9]/g,'');});
$('gate').onsubmit=async event=>{event.preventDefault();if(busy)return;if(!input.value){setStatus('Enter the code first.');input.focus();return;}if(!window.crypto||!crypto.subtle){setStatus('Open this page over HTTPS or on localhost in a modern browser.',true);return;}setBusy(true);setStatus('Opening your space…');try{const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(input.value),'PBKDF2',false,['deriveBits']);const raw=await crypto.subtle.deriveBits({name:'PBKDF2',salt:decode(payload.salt),iterations:payload.iterations,hash:'SHA-256'},material,256);const content=await decrypt(raw);try{if($('remember').checked)saveKey(raw);else forget();}catch(e){}showFrame(content);}catch(error){forget();setStatus('Wrong code. Please try again.',true);input.value='';}finally{setBusy(false);}};
// x.html?forget clears the saved key
if(/[?&]forget(&|=|$)/.test(location.search)){forget();history.replaceState(null,'',location.pathname);}

// Remote/arrow navigation over the 9-column grid and the Clear/Delete row
const DIGITS=COLS*4,CLEAR=DIGITS,BACK=DIGITS+1;
function move(i,key){
  if(i<DIGITS){const row=Math.floor(i/COLS),col=i%COLS;
    if(key==='ArrowLeft')return Math.max(0,i-1);
    if(key==='ArrowRight')return i+1;
    if(key==='ArrowUp')return row?i-COLS:i;
    return row<3?i+COLS:(col<=4?CLEAR:BACK);}
  if(key==='ArrowLeft')return CLEAR;
  if(key==='ArrowRight')return BACK;
  if(key==='ArrowUp')return DIGITS-COLS+(i===CLEAR?2:6);
  return -1;
}
document.addEventListener('keydown',event=>{const buttons=[...$('keys').children],i=buttons.indexOf(document.activeElement);if(i<0||!event.key.startsWith('Arrow'))return;event.preventDefault();const next=move(i,event.key);if(next<0)$('remember').focus();else buttons[next].focus();});
$('remember').addEventListener('keydown',e=>{if(e.key==='ArrowUp'){e.preventDefault();$('keys').lastElementChild.focus();}if(e.key==='ArrowDown'){e.preventDefault();$('unlock').focus();}});
$('unlock').addEventListener('keydown',event=>{if(event.key==='ArrowUp'){event.preventDefault();$('remember').focus();}});
async function restore(){let stored;try{stored=readKey();}catch(e){forget();}if(stored){try{showFrame(await decrypt(decode(stored)));return;}catch(e){forget();setStatus('Saved key did not work. Please enter the code again.',true);}}document.documentElement.classList.remove('checking');$('keys').firstElementChild.focus();}
restore();
</script>
</body></html>
